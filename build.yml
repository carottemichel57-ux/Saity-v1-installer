name: Build VPK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: Saity-V1-Installer
          path: build/*.vpk
